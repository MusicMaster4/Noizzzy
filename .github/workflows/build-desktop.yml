name: Build Noizzzy Desktop

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noizzzy-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate version and release tag availability
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version="$(node --print "require('./package.json').version")"
          tag="v${version}"
          node scripts/validate-release-version.mjs "${tag}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists. Increment the project version before merging into main."
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists without a release. Resolve that tag before retrying."
            exit 1
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Quality and core tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Install worker test dependencies
        run: python -m pip install -e "./worker[dev]"

      - name: Run frontend checks
        run: |
          npm run lint --prefix web
          npm run web:build

      - name: Run desktop unit tests
        run: npm test

      - name: Run worker tests
        run: python -m pytest worker/tests

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package ${{ matrix.name }}
    needs:
      - quality
      - release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            command: dist:windows
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            command: dist:mac-arm
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            command: dist:mac-intel
            artifact: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix web

      - name: Install worker build dependencies
        shell: bash
        run: python -m pip install -e "./worker[dev]" "pyinstaller>=6.16,<7"

      - name: Build native installer
        shell: bash
        env:
          NOIZZZY_BUILD_PYTHON: python
        run: npm run ${{ matrix.command }}

      - name: Test packaged worker with real FFmpeg processing
        shell: bash
        run: npm run test:worker-smoke

      - name: Test packaged worker restart and port release
        shell: bash
        run: npm run test:worker-restart

      - name: Resolve target-specific AI runtime
        shell: bash
        run: npm run runtime:validate

      - name: Process a video with real AI separation and restoration
        shell: bash
        run: npm run test:ai-pipeline

      - name: Test packaged Electron application
        shell: bash
        run: npm run test:e2e:packaged

      - name: Verify installers, sidecars, and native architecture
        shell: bash
        run: npm run verify:artifacts

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Noizzzy-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: needs.release-metadata.outputs.publish == 'true'
    needs:
      - package
      - release-metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all native installers
        uses: actions/download-artifact@v8
        with:
          pattern: Noizzzy-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --generate-notes --title "Noizzzy ${RELEASE_TAG}"
