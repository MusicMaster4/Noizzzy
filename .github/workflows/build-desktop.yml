name: Build Noizzzy Desktop

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and core tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix web

      - name: Install worker test dependencies
        run: python -m pip install -e "./worker[dev]"

      - name: Run frontend checks
        run: |
          npm run lint --prefix web
          npm run web:build

      - name: Run desktop unit tests
        run: npm test

      - name: Run worker tests
        run: python -m pytest worker/tests

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            command: dist:windows
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            command: dist:mac-arm
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            command: dist:mac-intel
            artifact: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix web

      - name: Install worker build dependencies
        shell: bash
        run: python -m pip install -e "./worker[dev]" "pyinstaller>=6.16,<7"

      - name: Build native installer
        shell: bash
        env:
          NOIZZZY_BUILD_PYTHON: python
        run: npm run ${{ matrix.command }}

      - name: Test packaged worker with real FFmpeg processing
        shell: bash
        run: npm run test:worker-smoke

      - name: Resolve target-specific AI runtime
        shell: bash
        run: npm run runtime:validate

      - name: Test packaged Electron application
        shell: bash
        run: npm run test:e2e:packaged

      - name: Verify installers, sidecars, and native architecture
        shell: bash
        run: npm run verify:artifacts

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Noizzzy-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all native installers
        uses: actions/download-artifact@v4
        with:
          pattern: Noizzzy-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes --title "Noizzzy ${GITHUB_REF_NAME}"
