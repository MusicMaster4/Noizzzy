[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "noizzzy-worker"
version = "1.0.2"
description = "Local FastAPI worker for professional dialogue isolation and mastering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
separation = ["audio-separator[cpu]>=0.30,<1", "audioread>=3.1,<4"]
separation-gpu = [
  "audio-separator[gpu]>=0.30,<1",
  "audioread>=3.1,<4",
  "onnxruntime-gpu==1.26.0",
]
enhancement = ["clearvoice==0.1.2"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["voice_worker"]

[tool.uv]
conflicts = [
  [
    { extra = "separation" },
    { extra = "enhancement" },
  ],
  [
    { extra = "separation-gpu" },
    { extra = "enhancement" },
  ],
  [
    { extra = "separation" },
    { extra = "separation-gpu" },
  ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
